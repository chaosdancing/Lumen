name: Lumen
options:
  bundleIdPrefix: com.example.lumen
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: WZ6AS9TRW2
    CURRENT_PROJECT_VERSION: 13
    MARKETING_VERSION: 0.1.5
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit
    exactVersion: 1.1.0-n9.0.2

targets:
  Lumen-UnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Unit
    dependencies:
      - target: Lumen-iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Lumen-iOS
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Lumen.app/Lumen"
        BUNDLE_LOADER: "$(TEST_HOST)"
        PRODUCT_BUNDLE_IDENTIFIER: com.consynia.lumen.unittests
        PRODUCT_NAME: LumenUnitTests
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1,2"

  Lumen-iOS-UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/iOS
    dependencies:
      - target: Lumen-iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Lumen-iOS
        PRODUCT_BUNDLE_IDENTIFIER: com.consynia.lumen.uitests
        PRODUCT_NAME: LumenUITests
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1,2"

  Lumen-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    dependencies:
      - package: MPVKit
        product: MPVKit
    info:
      path: Info-macOS.plist
      properties:
        CFBundleName: Lumen
        CFBundleDisplayName: Lumen
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: ""
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Lumen 需要访问局域网内的 NAS、WebDAV 与媒体服务器。
        NSBonjourServices:
          - _http._tcp
          - _https._tcp
    settings:
      base:
        PRODUCT_NAME: Lumen
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lumen.mac
        SDKROOT: macosx
        SUPPORTED_PLATFORMS: macosx
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info-macOS.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Lumen-macOS-Development.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) DEBUG=1"
        Release:
          CODE_SIGN_ENTITLEMENTS: Lumen.entitlements

  Lumen-iOS:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - Lumen-UnitTests
        - Lumen-iOS-UITests
    dependencies:
      - package: MPVKit
        product: MPVKit
      - sdk: OpenGLES.framework
      - sdk: CoreVideo.framework
      - sdk: CoreMedia.framework
      - sdk: AVFoundation.framework
    sources:
      - path: Sources
      - path: Assets.xcassets
    info:
      path: Info-iOS.plist
      properties:
        CFBundleName: Lumen
        CFBundleDisplayName: Lumen
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Lumen 需要访问局域网内的 NAS、WebDAV 与媒体服务器。
        NSBonjourServices:
          - _http._tcp
          - _https._tcp
    settings:
      base:
        PRODUCT_NAME: Lumen
        PRODUCT_BUNDLE_IDENTIFIER: com.consynia.lumen
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info-iOS.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: ""
          ENABLE_TESTABILITY: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) DEBUG=1"
        Release:
          CODE_SIGN_ENTITLEMENTS: Lumen-iOS.entitlements
